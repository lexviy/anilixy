name: Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install ".[pdf]" pyinstaller

      - name: Build and smoke test
        run: python scripts/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: anilixy-windows-x64
          path: dist/anilixy-windows-x64.zip

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" dist/anilixy-windows-x64.zip --clobber ||
            gh release create "$TAG" dist/anilixy-windows-x64.zip --generate-notes
